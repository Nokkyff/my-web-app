<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 Lịch Sử Mua Hàng — vpsgiare</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="store.css">
  <style>
    .history-page { max-width: 800px; margin: 0 auto; padding: 20px 16px 60px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .history-header h1 { font-size: 1.4rem; }
    .history-back { text-decoration: none; color: var(--accent); font-weight: 600; font-size: 0.9rem; }
    .history-back:hover { text-decoration: underline; }
    .history-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; display: flex; gap: 14px; align-items: center; }
    .history-card-img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }
    .history-card-img.emoji-ph { display: flex; align-items: center; justify-content: center; font-size: 1.8rem; background: var(--bg); }
    .history-card-info { flex: 1; }
    .history-card-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 2px; }
    .history-card-meta { font-size: 0.8rem; color: var(--text-dim); }
    .history-card-right { text-align: right; }
    .history-card-price { font-weight: 700; color: var(--gold); font-size: 0.95rem; }
    .history-card-qty { font-size: 0.8rem; color: var(--text-dim); }
    .history-card-date { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }
    .history-empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
    .history-empty p { margin-bottom: 12px; }
    .history-stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .history-stat-card { flex: 1; min-width: 150px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
    .history-stat-card .stat-value { font-size: 1.3rem; font-weight: 800; color: var(--gold); }
    .history-stat-card .stat-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }

    /* Deposit history section */
    .section-divider { border-top: 1px solid var(--border); margin: 28px 0 20px; padding-top: 20px; }
    .section-divider h2 { font-size: 1.1rem; margin-bottom: 14px; }
    .deposit-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .deposit-info { font-size: 0.9rem; }
    .deposit-amount { font-weight: 700; color: var(--green); }
    .deposit-status { font-size: 0.75rem; padding: 3px 10px; border-radius: 10px; font-weight: 700; text-transform: uppercase; }
    .deposit-status.pending { background: rgba(255,167,38,0.15); color: var(--orange); }
    .deposit-status.approved { background: rgba(102,187,106,0.15); color: var(--green); }
    .deposit-status.rejected { background: rgba(239,83,80,0.15); color: var(--red); }
    .deposit-date { font-size: 0.75rem; color: var(--text-dim); }
  </style>
</head>
<body>
  <div class="history-page">
    <header id="top-bar" style="margin-bottom:16px;">
      <a href="store.html" class="logo">
        <img src="avatar.png" alt="Avatar" class="logo-avatar"> vpsgiare
      </a>
      <a href="store.html" class="history-back">← Quay lại cửa hàng</a>
    </header>

    <div class="history-header">
      <h1>📋 Lịch Sử Mua Hàng & Nạp Tiền</h1>
    </div>

    <div id="history-not-logged" class="history-empty" style="display:none;">
      <p style="font-size:2rem;">🔒</p>
      <p>Vui lòng <a href="store.html" style="color:var(--accent);">đăng nhập</a> để xem lịch sử.</p>
    </div>

    <!-- Stats -->
    <div id="history-stats" class="history-stats"></div>

    <!-- Purchase History -->
    <div id="history-list"></div>

    <!-- Deposit History -->
    <div id="deposit-history-section"></div>
  </div>

  <script>
  (function() {
    "use strict";

    const KEYS = {
      theme: "vpsgiare_theme",
      customerSession: "vpsgiare_customer_session",
      orders: "vpsgiare_orders",
      deposits: "vpsgiare_deposits",
    };

    function load(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } }
    function formatVND(n) { return (Math.round(n)||0).toLocaleString("vi-VN") + " ₫"; }

    // Theme
    const theme = localStorage.getItem(KEYS.theme) || "dark";
    document.documentElement.setAttribute("data-theme", theme);

    // Session
    let session;
    try { session = JSON.parse(sessionStorage.getItem(KEYS.customerSession)); } catch { session = null; }

    if (!session) {
      document.getElementById("history-not-logged").style.display = "block";
      return;
    }

    // Orders
    const allOrders = load(KEYS.orders, []);
    const myOrders = allOrders.filter(o => o.userId === session.id).sort((a,b) => new Date(b.date) - new Date(a.date));

    // Stats
    const statsEl = document.getElementById("history-stats");
    const totalSpent = myOrders.reduce((s,o) => s + (o.total||0), 0);
    const totalItems = myOrders.reduce((s,o) => s + (o.qty||0), 0);
    statsEl.innerHTML = `
      <div class="history-stat-card"><div class="stat-value">${myOrders.length}</div><div class="stat-label">Đơn hàng</div></div>
      <div class="history-stat-card"><div class="stat-value">${totalItems}</div><div class="stat-label">Dịch vụ đã mua</div></div>
      <div class="history-stat-card"><div class="stat-value">${formatVND(totalSpent)}</div><div class="stat-label">Tổng chi tiêu</div></div>
    `;

    // Order list
    const listEl = document.getElementById("history-list");
    if (myOrders.length === 0) {
      listEl.innerHTML = '<div class="history-empty"><p style="font-size:2rem;">📭</p><p>Bạn chưa có đơn hàng nào.</p><a href="store.html" style="color:var(--accent);">Mua sắm ngay →</a></div>';
    } else {
      myOrders.forEach(o => {
        const card = document.createElement("div");
        card.className = "history-card";
        const imgHtml = o.image
          ? '<img src="' + o.image + '" class="history-card-img" alt="">'
          : '<div class="history-card-img emoji-ph">' + (o.emoji||"⚡") + '</div>';
        card.innerHTML = imgHtml +
          '<div class="history-card-info"><div class="history-card-name">' + o.productName + '</div><div class="history-card-meta">' + (o.category||"") + '</div></div>' +
          '<div class="history-card-right"><div class="history-card-price">' + formatVND(o.total) + '</div><div class="history-card-qty">×' + o.qty + '</div><div class="history-card-date">' + new Date(o.date).toLocaleString("vi-VN") + '</div></div>';
        listEl.appendChild(card);
      });
    }

    // Deposit history
    const allDeposits = load(KEYS.deposits, []);
    const myDeposits = allDeposits.filter(d => d.userId === session.id).sort((a,b) => new Date(b.date) - new Date(a.date));

    const depSection = document.getElementById("deposit-history-section");
    const totalDeposited = myDeposits.filter(d => d.status === "approved").reduce((s,d) => s + d.amount, 0);
    const pendingDeposits = myDeposits.filter(d => d.status === "pending");
    const pendingTotal = pendingDeposits.reduce((s,d) => s + d.amount, 0);

    let depHtml = '<div class="section-divider"><h2>💳 Lịch Sử Nạp Tiền (' + myDeposits.length + ')</h2>';

    // Deposit stats
    depHtml += '<div class="history-stats" style="margin-bottom:16px;">';
    depHtml += '<div class="history-stat-card"><div class="stat-value">' + formatVND(totalDeposited) + '</div><div class="stat-label">Tổng đã nạp (duyệt)</div></div>';
    depHtml += '<div class="history-stat-card"><div class="stat-value">' + pendingDeposits.length + '</div><div class="stat-label">Đang chờ duyệt</div></div>';
    depHtml += '<div class="history-stat-card"><div class="stat-value">' + formatVND(pendingTotal) + '</div><div class="stat-label">Số tiền chờ</div></div>';
    depHtml += '</div>';

    if (myDeposits.length === 0) {
      depHtml += '<div class="history-empty"><p style="font-size:2rem;">💳</p><p>Bạn chưa có yêu cầu nạp tiền nào.</p></div>';
    } else {
      myDeposits.forEach(d => {
        const statusClass = d.status === "approved" ? "approved" : d.status === "rejected" ? "rejected" : "pending";
        const statusText = d.status === "approved" ? "✅ Đã duyệt" : d.status === "rejected" ? "❌ Từ chối" : "⏳ Chờ duyệt";
        depHtml += '<div class="deposit-card"><div><div class="deposit-info">Nạp <span class="deposit-amount">' + formatVND(d.amount) + '</span></div>';
        if (d.note) depHtml += '<div class="deposit-date">📝 ' + d.note + '</div>';
        depHtml += '<div class="deposit-date">' + new Date(d.date).toLocaleString("vi-VN") + '</div></div><span class="deposit-status ' + statusClass + '">' + statusText + '</span></div>';
      });
    }
    depHtml += '</div>';
    depSection.innerHTML = depHtml;
  })();
  </script>
</body>
</html>
